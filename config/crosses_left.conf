# Left half is the central so it also works on its own; the right half joins as a peripheral.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="Crosses BT"
# No SMOOTH_SCROLLING: Windows honors its 1/16 resolution multiplier (macOS ignores it),
# so the 1/32 scroll scalers tuned on the Mac scrolled ~16x slower on Windows.
