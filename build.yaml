---
# Dedicated reset image: erase only the settings flash partition on boot.
include:
  - board: nice_nano
    shield: settings_reset
    artifact-name: crosses_settings_reset
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_LOG_MAX_LEVEL=3
