---
# Internal RC oscillator works on every nice!nano clone, with or without the 32k crystal.
include:
  - board: nice_nano
    shield: crosses_right
    artifact-name: crosses_54_right
    cmake-args: >-
      -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_BT_CTLR_PHY_2M=n
      -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE};${GITHUB_WORKSPACE}/modules/profile-modifiers;${GITHUB_WORKSPACE}/modules/scroll-keys"
      -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/config/right-matrix-row2col.overlay;${GITHUB_WORKSPACE}/config/crosses-trackball-spi.overlay"
  - board: nice_nano
    shield: crosses_left
    artifact-name: crosses_54_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=y -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_BT_CTLR_PHY_2M=n
      -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE};${GITHUB_WORKSPACE}/modules/profile-modifiers;${GITHUB_WORKSPACE}/modules/scroll-keys"
      -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/config/left-matrix-row2col.overlay;${GITHUB_WORKSPACE}/config/crosses-trackball-spi.overlay"
